# Personal Alpha Terminal terminal-first configuration
market: US
benchmark: SPY
nasdaq_benchmark: QQQ
vix_symbol: ^VIX
history_start: 2015-01-01
cache_dir: data/cache
report_dir: reports
provider_priority:
  - yahoo
  - stooq
timeout_seconds: 20
max_retries: 2
retry_backoff_seconds: 0.5
data_safe_threshold: 80
data_watch_threshold: 65
reconciliation_minimum_coverage: 0.95
reconciliation_warning_tolerance: 0.01
maximum_provider_difference: 0.05
reconciliation_maximum_blocking_ratio: 0.01
nasdaq_23h_enabled: false
night_execution_enabled: false
default_execution_session: REGULAR
# Holdings and cash belong only in the real portfolio ledger.
