# Personal Alpha Terminal - local, terminal-first configuration
market: US
benchmark: SPY
nasdaq_benchmark: QQQ
vix_symbol: ^VIX
history_start: 2015-01-01
cache_dir: data/cache
report_dir: reports
primary_provider: yahoo
fallback_provider: stooq
provider_priority:
  - yahoo
  - stooq
independent_provider_priority:
  - twelve_data
  - alpha_vantage
  - stooq
timeout_seconds: 20
max_retries: 2
retry_backoff_seconds: 0.5
universe_minimum_price: 5.0
universe_minimum_trading_sessions: 252
universe_minimum_average_dollar_volume: 10000000
universe_minimum_median_dollar_volume: 10000000
universe_minimum_valid_bar_coverage: 0.98
universe_maximum_missing_ratio: 0.02
universe_include_adr: false
universe_include_reit: false
# ROUND 5: the production daily path uses the broad current
# operational universe (CURRENT_OPERATIONAL_PIT).  Setting this False
# keeps the strict certified total-return tier (HISTORICAL_RESEARCH_PIT)
# available for research only; a degraded historical tier never collapses
# the current operational universe.
universe_require_pit_total_return: false
universe_minimum_operational_universe: 50
universe_coverage_collapse_ratio: 0.5
universe_candidate_min_alpha: 0.0
# ROUND24: ETF multi-sleeve universe (C4-C10).  These are risk-control
# diversification caps, not return tuning.  ETF sleeve models remain
# RESEARCH_CANDIDATE and never modify the Classical Champion equity path.
etf_sleeves_enabled: true
ai_brief_enabled: true
etf_core_budget: 0.25
etf_tactical_budget: 0.10
etf_max_single_weight: 0.10
etf_minimum_cash_weight: 0.05
# ROUND 6: live-portfolio rebalance / no-trade thresholds.  These are
# part of the portfolio constraint hash and therefore of the strategy
# identity: changing them invalidates existing operational approvals.
no_trade_band: 0.005
minimum_rebalance_weight: 0.01
minimum_trade_value: 100.0
data_safe_threshold: 80
data_watch_threshold: 65
reconciliation_minimum_coverage: 0.95
reconciliation_warning_tolerance: 0.01
maximum_provider_difference: 0.05
reconciliation_maximum_blocking_ratio: 0.01
reconciliation_minimum_overlap_sessions: 20
reconciliation_preferred_overlap_sessions: 60
nasdaq_23h_enabled: false
night_execution_enabled: false
default_execution_session: REGULAR
allow_calendar_fallback: false
portfolio_id: main
stress_maximum_cvar_loss: 0.06
stress_maximum_liquidation_days: 5.0
stress_maximum_correlation_spike_loss: 0.08
stress_maximum_gap_loss: 0.08
stress_maximum_stressed_volatility: 0.30
stress_maximum_benchmark_crash_loss: 0.25
stress_maximum_single_name_loss: 0.05
stress_maximum_sector_loss: 0.10
stress_warning_ratio: 0.80
# Holdings and cash are intentionally absent. The real portfolio ledger is the
# only source of truth. ``main`` is the stable external ledger identity.
